name: Build mod jar

on:
  push:
  workflow_dispatch:


        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - name: Build
        run: gradle build
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: hudmenu-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
